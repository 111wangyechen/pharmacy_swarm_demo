      .arrow { stroke: #6b7280; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
      .loop { stroke: #d97706; stroke-width: 2.6; fill: none; marker-end: url(#arrowhead-orange); stroke-dasharray: 8 6; }
